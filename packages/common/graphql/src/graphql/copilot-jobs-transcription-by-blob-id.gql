query getAudioTranscriptionByBlobId(
  $workspaceId: String!
  $blobId: String!
) {
  currentUser {
    copilot(workspaceId: $workspaceId) {
      audioTranscriptionByBlobId(blobId: $blobId) {
        id
        status
        transcription {
          speaker
          start
          end
          transcription
        }
        summary
      }
    }
  }
} 